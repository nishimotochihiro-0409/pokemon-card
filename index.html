<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Card Battle Lab</title><style>body{margin:0;background:#102b31;color:#f5f5ed;font:15px system-ui}header,section,footer{padding:12px}header{display:flex;justify-content:space-between;background:#183d45}button{border:0;border-radius:9px;padding:11px;margin:3px;background:#8fddc0;color:#14352d;font-weight:bold}button:disabled{opacity:.4}.board{max-width:900px;margin:auto}.zone{background:#21434a;border:1px solid #426c71;border-radius:12px;margin:9px;padding:10px;min-height:68px}.cards{display:flex;flex-wrap:wrap;gap:6px}.card{width:76px;min-height:100px;border-radius:8px;background:#f5e8cb;color:#253338;padding:6px;box-sizing:border-box;font-size:11px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;border:3px solid transparent}.card.selected{border-color:#ffbb42}.card.cpu{background:#8caeb0}.card b{font-size:12px}.hint{color:#bed5d3;font-size:12px}.row{display:flex;gap:7px;flex-wrap:wrap}.stat{font-size:12px;color:#cce3dd}#log{max-height:90px;overflow:auto;font-size:12px;color:#e3e7cf}h3{margin:3px 0 9px}</style><div class="board"><header><strong>⚡ CARD BATTLE LAB</strong><span id="turn"></span></header><section><div class="row"><button onclick="newGame()">新しい対戦</button><button onclick="draw()">1枚引く</button><button onclick="endTurn()">ターン終了 / CPU行動</button><button onclick="undo()">1手戻す</button></div><p class="hint">仮カードで遊ぶ簡易練習版。手札のポケモンを選び「バトル場へ」「ベンチへ」で配置。エネルギーとダメージは手動管理。公式ルール・効果は未実装。</p><div class="zone"><h3>CPU <span id="cpuStat" class="stat"></span></h3><div id="cpuField" class="cards"></div><div id="cpuBench" class="cards"></div></div><div class="zone"><h3>自分のバトル場</h3><div id="myField" class="cards"></div></div><div class="zone"><h3>自分のベンチ</h3><div id="myBench" class="cards"></div></div><div class="zone"><h3>手札 <span id="myStat" class="stat"></span></h3><div id="hand" class="cards"></div></div><div class="row"><button onclick="place('field')">バトル場へ</button><button onclick="place('bench')">ベンチへ</button><button onclick="energy()">エネルギー +1</button><button onclick="damage(10)">ダメージ +10</button><button onclick="damage(-10)">ダメージ -10</button><button onclick="attack()">攻撃する</button></div><p id="selection" class="hint"></p><div class="zone"><h3>対戦ログ</h3><div id="log"></div></div></section><footer class="hint">非公式・オリジナル仮カード版。データはこの端末に保存されます。</footer></div><script>
const KEY='card-battle-lab-v1';let state,history=[],selected=null;const names=['スパークマウス','リーフキャット','アクアフィン','フレイムフォックス','ストーンタートル','ウィンドバード'];function makeDeck(){let a=[];for(let i=0;i<20;i++)a.push({id:crypto.randomUUID(),name:names[i%6],hp:100,damage:0,energy:0,kind:'pokemon'});for(let i=0;i<24;i++)a.push({id:crypto.randomUUID(),name:'基本エネルギー',kind:'energy'});for(let i=0;i<16;i++)a.push({id:crypto.randomUUID(),name:'練習用トレーナーズ',kind:'trainer'});return a.sort(()=>Math.random()-.5)}function fresh(){return {deck:makeDeck(),hand:[],field:[],bench:[],discard:[],cpuDeck:makeDeck(),cpuHand:[],cpuField:[],cpuBench:[],cpuDiscard:[],round:1,log:['対戦開始！'],prize:6,cpuPrize:6}}function snapshot(){history.push(JSON.stringify(state));if(history.length>40)history.shift()}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function msg(t){state.log.unshift(t);state.log=state.log.slice(0,30)}function newGame(){state=fresh();selected=null;history=[];for(let i=0;i<7;i++){if(state.deck.length)state.hand.push(state.deck.pop());if(state.cpuDeck.length)state.cpuHand.push(state.cpuDeck.pop())}cpuSetup();save();render()}function cpuSetup(){let i=state.cpuHand.findIndex(x=>x.kind==='pokemon');if(i>=0)state.cpuField.push(state.cpuHand.splice(i,1)[0]);else{while(state.cpuDeck.length&&!state.cpuField.length){let c=state.cpuDeck.pop();if(c.kind==='pokemon')state.cpuField.push(c);else state.cpuHand.push(c)}}}function draw(){if(!state.deck.length)return msg('山札がありません'),render();snapshot();state.hand.push(state.deck.pop());msg('1枚ドロー');save();render()}function card(c,zone){let d=document.createElement('div');d.className='card'+(selected&&selected.id===c.id?' selected':'')+(zone.startsWith('cpu')?' cpu':'');d.innerHTML='<b></b><span></span><small></small>';d.children[0].textContent=c.name;d.children[1].textContent=c.kind==='pokemon'?'HP '+Math.max(0,c.hp-c.damage)+' / '+c.hp:c.kind==='energy'?'エネルギー':'トレーナーズ';d.children[2].textContent=c.kind==='pokemon'?'E '+c.energy+' ・ ダメージ '+c.damage:'';if(!zone.startsWith('cpu'))d.onclick=()=>{selected={id:c.id,zone};render()};return d}function renderZone(id,arr){let e=document.getElementById(id);e.replaceChildren(...arr.map(c=>card(c,id)))}function render(){for(let id of ['cpuField','cpuBench','myField','myBench','hand'])renderZone(id,id==='myField'?state.field:id==='myBench'?state.bench:state[id]);document.getElementById('turn').textContent='ターン '+state.round;document.getElementById('myStat').textContent='山札 '+state.deck.length+' / サイド '+state.prize+' / トラッシュ '+state.discard.length;document.getElementById('cpuStat').textContent='山札 '+state.cpuDeck.length+' / 手札 '+state.cpuHand.length+' / サイド '+state.cpuPrize;document.getElementById('selection').textContent=selected?'選択中: '+(findSelected()?.name||'なし'):'カードをタップして選択';document.getElementById('log').textContent=state.log.join(' ｜ ')}function findSelected(){if(!selected)return null;let a=state[selected.zone==='myField'?'field':selected.zone==='myBench'?'bench':selected.zone];return a?.find(x=>x.id===selected.id)}function place(to){if(!selected||selected.zone!=='hand')return alert('手札のカードを選んでね');let c=findSelected();if(c.kind!=='pokemon')return alert('ポケモンを選んでね');if(to==='field'&&state.field.length)return alert('バトル場にはすでにポケモンがいます');if(to==='bench'&&state.bench.length>=5)return alert('ベンチは5匹まで');snapshot();state.hand=state.hand.filter(x=>x.id!==c.id);state[to].push(c);msg(c.name+'を配置');selected=null;save();render()}function target(){let c=findSelected();return c&&c.kind==='pokemon'&&(selected.zone==='myField'||selected.zone==='myBench')?c:null}function energy(){let c=target();if(!c)return alert('場のポケモンを選んでね');snapshot();c.energy++;msg(c.name+'にエネルギーを追加');save();render()}function damage(n){let c=target();if(!c)return alert('場のポケモンを選んでね');snapshot();c.damage=Math.max(0,c.damage+n);msg(c.name+'のダメージ '+c.damage);save();render()}function attack(){let c=state.field[0],enemy=state.cpuField[0];if(!c||!enemy)return alert('双方のバトル場にポケモンが必要');snapshot();enemy.damage+=30;msg(c.name+'が30ダメージ！');if(enemy.damage>=enemy.hp){state.cpuDiscard.push(state.cpuField.shift());state.cpuPrize=Math.max(0,state.cpuPrize-1);msg('CPUポケモンがきぜつ');if(state.cpuBench.length)state.cpuField.push(state.cpuBench.shift());else cpuSetup()}save();render()}function endTurn(){snapshot();if(state.cpuDeck.length)state.cpuHand.push(state.cpuDeck.pop());if(!state.cpuField.length)cpuSetup();let i=state.cpuHand.findIndex(x=>x.kind==='pokemon');if(i>=0&&state.cpuBench.length<5)state.cpuBench.push(state.cpuHand.splice(i,1)[0]);let c=state.cpuField[0];if(c){c.energy++;if(state.field[0]){state.field[0].damage+=20;msg('CPUの'+c.name+'が20ダメージ！');if(state.field[0].damage>=state.field[0].hp){state.discard.push(state.field.shift());state.prize=Math.max(0,state.prize-1);msg('自分のポケモンがきぜつ');if(state.bench.length)state.field.push(state.bench.shift())}}}state.round++;selected=null;msg('ターン '+state.round);save();render()}function undo(){if(!history.length)return alert('戻せる操作がありません');state=JSON.parse(history.pop());selected=null;save();render()}try{state=JSON.parse(localStorage.getItem(KEY));if(!state||!state.deck)newGame();else render()}catch(e){newGame()}
</script></html>
